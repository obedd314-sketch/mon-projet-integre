<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obed | Portfolio Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="terminal-container">
        <!-- Barre supérieure du terminal -->
        <div class="terminal-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <div class="terminal-title">obed@cyber-terminal:~</div>
        </div>

        <!-- Zone d'affichage du texte -->
        <div class="terminal-body" id="terminal-content">
            <p class="system-msg">[SYSTEM] Initialisation du protocole Cyber-Portfolio v1.0...</p>
            <p class="system-msg">[SYSTEM] Connexion sécurisée établie.</p>
            <p>Bienvenue. Tapez <span class="highlight">help</span> pour afficher la liste des commandes disponibles.</p>
            
            <!-- Ligne d'entrée interactive -->
            <div class="input-line">
                <span class="prompt">obed@cyber-terminal:~$</span>
                <input type="text" id="terminal-input" autofocus autocomplete="off">
            </div>
        </div>
    </div>

    <!-- Liaison avec le fichier JavaScript -->
    <script src="script.js" defer></script>
</body>
</html>
